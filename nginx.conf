server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;

    # CSP: allow same-origin assets + only the external APIs the app actually calls
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: https://challenges.cloudflare.com;
        connect-src 'self'
            https://api.anthropic.com
            https://routes.googleapis.com
            https://api.aviationstack.com
            https://waittime.tsa.dhs.gov
            https://nominatim.openstreetmap.org
            https://challenges.cloudflare.com;
        frame-src https://challenges.cloudflare.com;
        object-src 'none';
        base-uri 'self';
        form-action 'none';
    " always;

    # SPA fallback — all paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets — long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
